<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main class="page" style="max-width:480px">
  <h1>Change Password</h1>
  <p class="subtitle">Choose a new password for your account</p>
  <form class="card" id="f">
    <div style="margin-bottom:12px"><label>Current password</label><input id="cur" type="password" required></div>
    <div style="margin-bottom:12px"><label>New password</label><input id="nw" type="password" required minlength="4"></div>
    <div style="margin-bottom:14px"><label>Confirm new password</label><input id="nw2" type="password" required></div>
    <button class="btn">Save</button>
    <div id="msg" class="msg"></div>
  </form>
</main>
<script src="/assets/app.js"></script>
<script>
  initPage();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (nw.value !== nw2.value) return showMsg(msg, 'The new passwords do not match', false);
    try {
      await api('/api/auth/change-password', { method: 'POST', body: { current: cur.value, next: nw.value } });
      showMsg(msg, 'Password changed', true);
      f.reset();
    } catch (err) { showMsg(msg, err.message, false); }
  });
</script>
</body>
</html>
